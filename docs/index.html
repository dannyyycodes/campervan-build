<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campervan Build — Citroën Relay / Fiat Ducato L4 H3</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#d2d6da;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#222}
  model-viewer{position:relative;z-index:1;width:100vw;height:100vh}
  .hud{position:fixed;left:14px;top:12px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);
       padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5;max-width:340px;box-shadow:0 2px 14px rgba(0,0,0,.14)}
  .hud b{font-size:15px}
  .btns{margin-top:8px;display:flex;gap:8px}
  .btns button{flex:1 1 auto;padding:11px 8px;border:0;border-radius:8px;background:#e7eaee;color:#222;font-size:14px;cursor:pointer}
  .btns button.on{background:#2b6cb0;color:#fff}
  #cap{margin-top:8px;color:#444}
  .keys{margin-top:8px;color:#666;font-size:12px}
  .lk{margin-top:8px;font-size:12px}.lk a{color:#2b6cb0;text-decoration:none}
  button.reset{position:fixed;right:14px;top:12px;z-index:20;padding:9px 14px;border:0;border-radius:9px;background:#2b6cb0;color:#fff;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="hud">
  <b>Campervan Build — L4 H3</b><br>
  <span style="color:#555">Citroën Relay / Fiat Ducato · real model, to scale</span>
  <div class="btns">
    <button id="bVan" class="on" onclick="set('van')">Real van</button>
    <button id="bIn" onclick="set('inside')">See inside</button>
  </div>
  <div id="cap">The real Ducato/Relay, extra-long L4 H3, scaled to 6363 × 2050 × 2764 mm.</div>
  <div class="keys">Drag = spin · scroll = zoom · right-drag = slide</div>
  <div class="lk"><a href="https://github.com/dannyyycodes/campervan-build/tree/main/plan">📋 Build plan (systems)</a></div>
</div>
<button class="reset" onclick="reset()">Reset view</button>
<model-viewer id="mv" src="real_solid.glb?v=6" alt="campervan"
  camera-controls interaction-prompt="none" touch-action="none"
  camera-orbit="-45deg 76deg auto" field-of-view="32deg"
  shadow-intensity="1" exposure="1.05" environment-image="neutral">
</model-viewer>
<script>
var V={
 van:{src:'real_solid.glb?v=6',orbit:'-45deg 76deg auto',
      cap:'The real Ducato/Relay, extra-long L4 H3, scaled to 6363 × 2050 × 2764 mm.'},
 inside:{src:'real_inside.glb?v=6',orbit:'-58deg 72deg auto',
      cap:'See inside — body ghosted: transverse bed (blue) on the garage (brown) + bedside shelves (green) at the rear.'}};
var cur='van';
function set(m){cur=m;var v=document.getElementById('mv');v.src=V[m].src;reset();
 document.getElementById('bVan').className=(m==='van')?'on':'';
 document.getElementById('bIn').className=(m==='inside')?'on':'';
 document.getElementById('cap').textContent=V[m].cap;}
function reset(){var v=document.getElementById('mv');v.cameraOrbit=V[cur].orbit;}
</script>
</body>
</html>
