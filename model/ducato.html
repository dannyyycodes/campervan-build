<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Fiat Ducato / Citroën Relay L3 H3</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#d2d6da;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#222}
  model-viewer{width:100vw;height:100vh}
  .hud{position:fixed;left:14px;top:12px;background:rgba(255,255,255,.9);padding:11px 14px;border-radius:10px;
       font-size:13px;line-height:1.5;max-width:300px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
  .hud b{font-size:14px}
  button.reset{position:fixed;right:14px;top:12px;padding:9px 14px;border:0;border-radius:9px;background:#2b6cb0;color:#fff;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="hud">
  <b>Real Fiat Ducato / Citroën Relay</b><br>
  <span style="color:#555">L3 H3 · scaled to your exact size</span><br>
  5998 × 2050 × 2764 mm<br>
  <span style="color:#777;font-size:12px">real model · next: cut open + build inside</span>
</div>
<button class="reset" onclick="var v=document.querySelector('model-viewer');v.cameraOrbit='-45deg 75deg 11m';v.cameraTarget='0m 0m 0.9m'">Reset view</button>
<model-viewer src="real_ducato.glb" alt="Real Fiat Ducato L3 H3"
  camera-controls interaction-prompt="none" touch-action="none"
  camera-orbit="-45deg 75deg 11m" camera-target="0m 0m 0.9m"
  min-camera-orbit="auto auto 4m" max-camera-orbit="auto auto 40m"
  shadow-intensity="1" exposure="1.05" environment-image="neutral">
</model-viewer>
</body>
</html>
